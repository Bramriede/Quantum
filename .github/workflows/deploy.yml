name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Asset-manifest genereren
        run: node scripts/generate-asset-manifest.js

      - name: Schone site-map samenstellen
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/src
          cp -r assets _site/assets

      - name: Pages voorbereiden
        uses: actions/configure-pages@v5

      - name: Site uploaden als Pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployen naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
