<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Loopgraaf 1917</title>
<meta name="description" content="Verdedig je loopgraaf tegen golven aanvallers in deze WW1 base-defense browsergame." />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #14120f;
    overflow: hidden;
    touch-action: none;
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #game-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { touch-action: none; }
  #loading-fallback {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #c9b896;
    font-size: 18px;
    letter-spacing: 1px;
    background: #14120f;
    z-index: 0;
  }
</style>
</head>
<body>
<div id="game-container">
  <div id="loading-fallback">De linie wordt bemand…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
